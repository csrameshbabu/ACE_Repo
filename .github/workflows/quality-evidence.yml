name: ACE Quality Evidence

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run the two-minute synthetic k6 workload
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  java-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run deterministic Maven suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Build run and dataset evidence manifest
        if: always()
        run: python scripts/build_evidence_manifest.py

      - name: Upload test and architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-quality-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            target/surefire-reports/**
            target/site/**
            target/evidence-manifest.json
            docs/**
            src/test/resources/**
            tests/performance/**
            scripts/build_evidence_manifest.py
            README.md
            pom.xml

      - name: Fail if Maven reports any failed tests
        if: always()
        shell: bash
        run: |
          if ! compgen -G 'target/surefire-reports/*.txt' > /dev/null; then
            echo 'Surefire produced no test summary files.'
            exit 1
          fi
          if grep -Eq 'Failures: [1-9]|Errors: [1-9]' target/surefire-reports/*.txt; then
            echo 'One or more deterministic tests failed.'
            exit 1
          fi

  performance-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: grafana/setup-k6-action@v1
      - name: Start isolated synthetic API
        shell: bash
        run: |
          mkdir -p target
          mvn --batch-mode --no-transfer-progress spring-boot:run \
            -Dspring-boot.run.main-class=com.ace.banking.BankingApiApplication \
            > target/spring-boot.log 2>&1 &
          echo $! > target/spring-boot.pid
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://localhost:8080/api/v1/transfers; then
              exit 0
            fi
            sleep 2
          done
          cat target/spring-boot.log
          exit 1
      - name: Run bounded k6 transfer workload
        run: k6 run -e BASE_URL=http://localhost:8080 -e RUN_ID=gha-${{ github.run_id }} --summary-export target/k6-summary.json tests/performance/k6-transfer.js
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-k6-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/k6-summary.json
            target/spring-boot.log
            docs/performance-resilience-experiment.md
